name: Renovate

on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      log_level:
        description: Log level for this Renovate run.
        required: true
        default: info
        type: choice
        options:
          - info
          - debug
          - trace

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: renovate
    # Job-level so both the Renovate step and the run summary read one copy.
    env:
      LOG_LEVEL: ${{ github.event.inputs.log_level || 'info' }}
      # Every targeted repo carries its own renovate.json; never open
      # onboarding PRs from this runner.
      RENOVATE_REPOSITORIES: jasondockery/renovate-config,jasondockery/roost,jasondockery/groundwork
      # Secrets are not readable in step `if:` directly; surface presence
      # here so the App-token step can be skipped until the app exists.
      HAS_APP: ${{ secrets.RENOVATE_APP_CLIENT_ID != '' }}
    steps:
      - name: Checkout automation config
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # GitHub App identity (decided 2026-07-09): fine-grained PATs cannot
      # carry the Checks permission at all, so Renovate 403s on the
      # check-runs API, scores every branch yellow, and automerge silently
      # never fires (field-hit on roost PR #24). Apps have Checks plus
      # short-lived installation tokens. The step is skipped while the app
      # secrets are absent so the PAT keeps runs green during the
      # migration; once the first App run is green, remove the fallback
      # and revoke the PAT.
      - name: Mint runner token (GitHub App)
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: jasondockery
          repositories: renovate-config,roost,groundwork

      - name: Run Renovate
        id: renovate
        uses: renovatebot/github-action@dd5302ec17783b2fc721b19ae7209b57b1587765 # v46.1.17
        with:
          configurationFile: runner.json
          token: ${{ steps.app-token.outputs.token || secrets.RENOVATE_TOKEN }}
          renovate-version: 43.251.3

      - name: Report run summary
        if: always()
        env:
          RENOVATE_OUTCOME: ${{ steps.renovate.outcome }}
        run: |
          # Read the pinned version from the step above so this step never
          # carries a second copy that could drift.
          version="$(grep -m1 -oE 'renovate-version: [0-9]+\.[0-9]+\.[0-9]+' .github/workflows/renovate.yml | cut -d' ' -f2)"
          {
            echo "### Renovate run"
            echo ""
            echo "- Outcome: ${RENOVATE_OUTCOME}"
            echo "- Renovate version: \`${version}\`"
            echo "- Log level: ${LOG_LEVEL}"
            echo "- Repositories: ${RENOVATE_REPOSITORIES}"
          } >> "$GITHUB_STEP_SUMMARY" || true
