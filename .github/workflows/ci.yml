name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # zizmor-action SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Check workflow security
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          persona: pedantic
          advanced-security: true

      - name: Validate shared Renovate preset
        id: validate-preset
        run: npx --yes --package renovate@43.251.3 -- renovate-config-validator default.json

      - name: Validate local Renovate config
        id: validate-local
        run: npx --yes --package renovate@43.251.3 -- renovate-config-validator renovate.json

      - name: Validate self-hosted runner config
        id: validate-runner
        run: npx --yes --package renovate@43.251.3 -- renovate-config-validator runner.json

      - name: Report validation results
        if: always()
        env:
          PRESET_OUTCOME: ${{ steps.validate-preset.outcome }}
          LOCAL_OUTCOME: ${{ steps.validate-local.outcome }}
          RUNNER_OUTCOME: ${{ steps.validate-runner.outcome }}
        run: |
          # Read the pinned version from the validator commands above so this
          # step never carries a second copy that could drift.
          version="$(grep -m1 -oE 'renovate@[0-9]+\.[0-9]+\.[0-9]+' .github/workflows/ci.yml | cut -d@ -f2)"
          label() { case "$1" in success) echo pass ;; failure) echo fail ;; *) echo "$1" ;; esac; }
          for entry in "default.json ${PRESET_OUTCOME}" "renovate.json ${LOCAL_OUTCOME}" "runner.json ${RUNNER_OUTCOME}"; do
            file="${entry%% *}"
            outcome="${entry#* }"
            if [ "$outcome" = "failure" ]; then
              echo "::error title=Renovate config invalid: ${file}::validation failed — run npx --yes --package renovate@${version} -- renovate-config-validator ${file} locally"
            fi
          done
          {
            echo "### Renovate config validation"
            echo ""
            echo "| Config | Result |"
            echo "| --- | --- |"
            echo "| default.json | $(label "$PRESET_OUTCOME") |"
            echo "| renovate.json | $(label "$LOCAL_OUTCOME") |"
            echo "| runner.json | $(label "$RUNNER_OUTCOME") |"
            echo ""
            echo "Renovate version: \`${version}\`"
          } >> "$GITHUB_STEP_SUMMARY" || true
