name: Renovate
run-name: Renovate · ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'scheduled' }} · ${{ github.sha }}

on:
  schedule:
    # Inspect all consumers daily. Mature routine updates may create branches
    # on this run; security updates bypass the age and routine-rate gates.
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      log_level:
        description: Log level for this Renovate run.
        required: true
        default: info
        type: choice
        options:
          - info
          - debug
          - trace

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: renovate
    # Job-level so both the Renovate step and the run summary read one copy.
    env:
      LOG_LEVEL: ${{ github.event.inputs.log_level || 'info' }}
      LOG_FILE_FORMAT: json
      LOG_FILE_LEVEL: debug
      # Every targeted repo carries its own renovate.json; never open
      # onboarding PRs from this runner.
      RENOVATE_REPOSITORIES: jasondockery/renovate-config,jasondockery/roost,jasondockery/groundwork
    steps:
      - name: Record runner start
        id: job-start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout automation config
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record runner and checkout timing
        id: checkout-time
        if: always()
        env:
          STARTED: ${{ steps.job-start.outputs.epoch }}
        run: |
          case "$STARTED" in '' | 0 | *[!0-9]*) echo "::error::Checkout start epoch is invalid"; exit 1 ;; esac
          finished="$(date +%s)"
          [ "$finished" -ge "$STARTED" ] || { echo "::error::Checkout timing moved backwards"; exit 1; }
          echo "seconds=$(( finished - STARTED ))" >> "$GITHUB_OUTPUT"

      # Keep host and container paths distinct. The runner owns randomized,
      # run-scoped directories, while the container sees only the fixed private
      # log mount. No other repository or concurrent runner may share these
      # mutable files.
      - name: Prepare private Renovate runtime
        id: renovate-log
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_RUN_ID:-}" in
            '' | *[!0-9]*) echo "::error::GitHub run ID is invalid"; exit 1 ;;
          esac
          case "${GITHUB_RUN_ATTEMPT:-}" in
            '' | *[!0-9]*) echo "::error::GitHub run attempt is invalid"; exit 1 ;;
          esac
          [ -d "$RUNNER_TEMP" ] && [ ! -L "$RUNNER_TEMP" ] \
            || { echo "::error::GitHub runner temporary directory is not a real directory"; exit 1; }
          log_dir="$(mktemp -d "$RUNNER_TEMP/renovate-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")"
          runtime_dir="$(mktemp -d "$RUNNER_TEMP/renovate-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")"
          chmod 0700 "$log_dir"
          chmod 0700 "$runtime_dir"
          log_directory_identity="$(stat -Lc '%d:%i' "$log_dir")"
          runtime_directory_identity="$(stat -Lc '%d:%i' "$runtime_dir")"
          case "$log_directory_identity" in
            *[!0-9:]* | :* | *: | *:*:*) echo "::error::Renovate log directory identity is invalid"; exit 1 ;;
          esac
          case "$runtime_directory_identity" in
            *[!0-9:]* | :* | *: | *:*:*) echo "::error::Renovate runtime directory identity is invalid"; exit 1 ;;
          esac
          printf 'runtime-directory=%s\n' "$runtime_dir" >> "$GITHUB_OUTPUT"
          printf 'runtime-identity=%s\n' "$runtime_directory_identity" >> "$GITHUB_OUTPUT"
          [ -f runner.json ] && [ ! -L runner.json ] \
            || { echo "::error::Renovate runner configuration is not a regular file"; exit 1; }
          config_copy="$runtime_dir/runner.json"
          cp -- runner.json "$config_copy"
          chmod 0444 "$config_copy"
          [ -f tools/renovate-container-entrypoint.sh ] && [ ! -L tools/renovate-container-entrypoint.sh ] \
            || { echo "::error::Renovate container entrypoint is not a regular file"; exit 1; }
          entrypoint_copy="$runtime_dir/container-entrypoint.sh"
          cp -- tools/renovate-container-entrypoint.sh "$entrypoint_copy"
          chmod 0555 "$entrypoint_copy"
          phase_file="$runtime_dir/phases.tsv"
          summary_file="$runtime_dir/summary.md"
          printf 'LOG_FILE=/renovate-log/renovate.jsonl\n' >> "$GITHUB_ENV"
          printf 'directory=%s\n' "$log_dir" >> "$GITHUB_OUTPUT"
          printf 'host-log=%s/renovate.jsonl\n' "$log_dir" >> "$GITHUB_OUTPUT"
          printf 'identity=%s\n' "$log_directory_identity" >> "$GITHUB_OUTPUT"
          printf 'configuration-file=%s\n' "$config_copy" >> "$GITHUB_OUTPUT"
          printf 'entrypoint=%s\n' "$entrypoint_copy" >> "$GITHUB_OUTPUT"
          printf 'phase-file=%s\n' "$phase_file" >> "$GITHUB_OUTPUT"
          printf 'summary-file=%s\n' "$summary_file" >> "$GITHUB_OUTPUT"

      - name: Begin Node setup timing
        id: node-start
        if: always()
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Install Node
        id: node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Record Node setup timing
        id: node-time
        if: always()
        env:
          STARTED: ${{ steps.node-start.outputs.epoch }}
        run: |
          case "$STARTED" in '' | 0 | *[!0-9]*) echo "::error::Node start epoch is invalid"; exit 1 ;; esac
          finished="$(date +%s)"
          [ "$finished" -ge "$STARTED" ] || { echo "::error::Node timing moved backwards"; exit 1; }
          echo "seconds=$(( finished - STARTED ))" >> "$GITHUB_OUTPUT"

      - name: Begin Renovate runtime timing
        id: runtime-start
        if: always()
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Resolve Renovate runtime
        id: renovate-runtime
        run: echo "version=$(node tools/renovate-runtime.mjs --print-version)" >> "$GITHUB_OUTPUT"

      - name: Record Renovate runtime timing
        id: runtime-time
        if: always()
        env:
          STARTED: ${{ steps.runtime-start.outputs.epoch }}
        run: |
          case "$STARTED" in '' | 0 | *[!0-9]*) echo "::error::Runtime start epoch is invalid"; exit 1 ;; esac
          finished="$(date +%s)"
          [ "$finished" -ge "$STARTED" ] || { echo "::error::Runtime timing moved backwards"; exit 1; }
          echo "seconds=$(( finished - STARTED ))" >> "$GITHUB_OUTPUT"

      # GitHub App identity (decided 2026-07-09): fine-grained PATs cannot
      # carry the Checks permission at all, so Renovate 403s on the
      # check-runs API, scores every branch yellow, and automerge silently
      # never fires (field-hit on roost PR #24). Apps have Checks plus
      # short-lived installation tokens.
      # Least privilege on top of the repository restriction: without explicit
      # permission-* inputs the minted token inherits EVERY permission the App
      # installation holds (zizmor github-app finding). The set below is what
      # this deployment requires: contents/PR/issue/check/status/workflow write
      # for update PRs, the dashboard, and automerge; administration read for
      # repo settings; vulnerability-alerts read for the security lane.
      # Members read is intentionally omitted because team assignment/member
      # lookup is unsupported here. Widen only with a reviewed behavior change.
      - name: Begin GitHub App token timing
        id: token-start
        if: always()
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Mint runner token (GitHub App)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: jasondockery
          repositories: renovate-config,roost,groundwork
          permission-administration: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-metadata: read
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Record GitHub App token timing
        id: token-time
        if: always()
        env:
          STARTED: ${{ steps.token-start.outputs.epoch }}
        run: |
          case "$STARTED" in '' | 0 | *[!0-9]*) echo "::error::Token start epoch is invalid"; exit 1 ;; esac
          finished="$(date +%s)"
          [ "$finished" -ge "$STARTED" ] || { echo "::error::Token timing moved backwards"; exit 1; }
          echo "seconds=$(( finished - STARTED ))" >> "$GITHUB_OUTPUT"

      - name: Begin Renovate execution timing
        id: renovate-start
        if: always()
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run Renovate
        id: renovate
        uses: renovatebot/github-action@316d7cd859606d6039a2182b7d69199e9b036835 # v46.2.1
        with:
          # Root inside the container must never receive a writable mount of
          # the checked-out source tree. The action mounts this disposable
          # runner-owned copy instead of repository runner.json.
          configurationFile: ${{ steps.renovate-log.outputs.configuration-file }}
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ steps.renovate-runtime.outputs.version }}
          # The image's default unprivileged UID cannot enter the runner-owned
          # 0700 directory. Root is confined to the container, receives no
          # Docker socket, and gets only the exact private log mount plus the
          # disposable config copy; the runner-owned parent still governs
          # host-side unlink and rmdir.
          docker-user: root
          # Expose only this run's randomized private directory at one fixed
          # container path. Never mount all of /tmp or the Docker socket.
          docker-volumes: '${{ steps.renovate-log.outputs.directory }}:/renovate-log'
          # The action mounts this disposable copy as the container command.
          # It proves the exact log mount is writable before execing Renovate.
          docker-cmd-file: ${{ steps.renovate-log.outputs.entrypoint }}
          # The action passes only an allowlist into its container. Keep the
          # default set and add exactly Renovate's documented file-log knobs.
          env-regex: '^(?:RENOVATE_\w+|LOG_(?:LEVEL|FILE|FILE_FORMAT|FILE_LEVEL)|GITHUB_COM_TOKEN|NODE_OPTIONS|NO_COLOR|(?:HTTPS?|NO)_PROXY|(?:https?|no)_proxy)$'

      - name: Record Renovate execution timing
        id: renovate-time
        if: always()
        env:
          STARTED: ${{ steps.renovate-start.outputs.epoch }}
        run: |
          case "$STARTED" in '' | 0 | *[!0-9]*) echo "::error::Renovate start epoch is invalid"; exit 1 ;; esac
          finished="$(date +%s)"
          [ "$finished" -ge "$STARTED" ] || { echo "::error::Renovate timing moved backwards"; exit 1; }
          echo "seconds=$(( finished - STARTED ))" >> "$GITHUB_OUTPUT"

      - name: Report run summary
        id: receipt
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CHECKOUT_SECONDS: ${{ steps.checkout-time.outputs.seconds }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          NODE_SECONDS: ${{ steps.node-time.outputs.seconds }}
          RUNTIME_OUTCOME: ${{ steps.renovate-runtime.outcome }}
          RUNTIME_SECONDS: ${{ steps.runtime-time.outputs.seconds }}
          TOKEN_OUTCOME: ${{ steps.app-token.outcome }}
          TOKEN_SECONDS: ${{ steps.token-time.outputs.seconds }}
          RENOVATE_OUTCOME: ${{ steps.renovate.outcome }}
          RENOVATE_SECONDS: ${{ steps.renovate-time.outputs.seconds }}
          RENOVATE_VERSION: ${{ steps.renovate-runtime.outputs.version }}
          JOB_STARTED_EPOCH: ${{ steps.job-start.outputs.epoch }}
          RENOVATE_LOG_DIR: ${{ steps.renovate-log.outputs.directory }}
          RENOVATE_LOG_FILE: ${{ steps.renovate-log.outputs.host-log }}
          RENOVATE_LOG_DIR_IDENTITY: ${{ steps.renovate-log.outputs.identity }}
          RENOVATE_RUNTIME_DIR: ${{ steps.renovate-log.outputs.runtime-directory }}
          RENOVATE_RUNTIME_DIR_IDENTITY: ${{ steps.renovate-log.outputs.runtime-identity }}
          RENOVATE_PHASE_FILE: ${{ steps.renovate-log.outputs.phase-file }}
          RENOVATE_SUMMARY_FILE: ${{ steps.renovate-log.outputs.summary-file }}
        run: |
          # Name the real failure. Without this, a failed checkout or setup
          # step reaches the receipt producer with an empty log directory and
          # the job's only error is "--log-directory is required".
          if [ -z "$RENOVATE_LOG_DIR" ] || [ -z "$RENOVATE_LOG_DIR_IDENTITY" ]; then
            echo "::error title=Renovate setup did not complete::The private log directory was never prepared, so no run receipt can be produced. Repair the failing checkout, Node, or runtime step above and rerun Renovate."
            exit 1
          fi
          if [ -z "$RENOVATE_RUNTIME_DIR" ] || [ -z "$RENOVATE_RUNTIME_DIR_IDENTITY" ] \
            || [ -z "$RENOVATE_PHASE_FILE" ] || [ -z "$RENOVATE_SUMMARY_FILE" ]; then
            echo "::error title=Renovate runtime setup did not complete::The run-scoped receipt paths were not prepared. Repair the setup step and rerun Renovate."
            exit 1
          fi
          [ -d "$RENOVATE_RUNTIME_DIR" ] && [ ! -L "$RENOVATE_RUNTIME_DIR" ] \
            || { echo "::error::Renovate runtime directory is not a real directory"; exit 1; }
          [ "$(stat -Lc '%d:%i' "$RENOVATE_RUNTIME_DIR")" = "$RENOVATE_RUNTIME_DIR_IDENTITY" ] \
            || { echo "::error::Renovate runtime directory identity changed"; exit 1; }
          [ "$RENOVATE_PHASE_FILE" = "$RENOVATE_RUNTIME_DIR/phases.tsv" ] \
            && [ "$RENOVATE_SUMMARY_FILE" = "$RENOVATE_RUNTIME_DIR/summary.md" ] \
            || { echo "::error::Renovate receipt paths escaped the run-scoped directory"; exit 1; }
          phase_result() {
            case "$1" in
              success) printf passed ;;
              failure) printf failed ;;
              cancelled) printf cancelled ;;
              skipped) printf skipped ;;
              *) printf failed ;;
            esac
          }
          phase_row() {
            printf '%s\t%s\t%s\t%s\n' "$1" "${2:-0}" "$(phase_result "$3")" "$4"
          }
          {
            phase_row 'Runner and checkout' "$CHECKOUT_SECONDS" "$CHECKOUT_OUTCOME" \
              "$([ "$CHECKOUT_OUTCOME" = skipped ] && printf 'checkout did not run' || true)"
            phase_row 'Node setup' "$NODE_SECONDS" "$NODE_OUTCOME" \
              "$([ "$NODE_OUTCOME" = skipped ] && printf 'checkout did not pass' || true)"
            phase_row 'Renovate runtime resolution' "$RUNTIME_SECONDS" "$RUNTIME_OUTCOME" \
              "$([ "$RUNTIME_OUTCOME" = skipped ] && printf 'Node setup did not pass' || true)"
            phase_row 'GitHub App token mint' "$TOKEN_SECONDS" "$TOKEN_OUTCOME" \
              "$([ "$TOKEN_OUTCOME" = skipped ] && printf 'runtime resolution did not pass' || true)"
            phase_row 'Renovate execution' "$RENOVATE_SECONDS" "$RENOVATE_OUTCOME" \
              "$([ "$RENOVATE_OUTCOME" = skipped ] && printf 'GitHub App token mint did not pass' || true)"
          } > "$RENOVATE_PHASE_FILE"
          receipt_status=0
          node tools/renovate-run-receipt.mjs \
            --log "$RENOVATE_LOG_FILE" \
            --log-directory "$RENOVATE_LOG_DIR" \
            --log-directory-identity "$RENOVATE_LOG_DIR_IDENTITY" \
            --repositories "$RENOVATE_REPOSITORIES" \
            --token-outcome "$TOKEN_OUTCOME" \
            --outcome "$RENOVATE_OUTCOME" \
            --phase-file "$RENOVATE_PHASE_FILE" \
            --version "${RENOVATE_VERSION:-unresolved}" \
            --log-level "$LOG_LEVEL" \
            --started-epoch "$JOB_STARTED_EPOCH" \
            --finished-epoch "$(date +%s)" \
            --output renovate-run-receipt.json \
            --summary "$RENOVATE_SUMMARY_FILE" || receipt_status=$?
          [ ! -f "$RENOVATE_SUMMARY_FILE" ] \
            || cat "$RENOVATE_SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY" \
            || echo "::warning title=Job summary unavailable::The authoritative Renovate receipt was written, but its Markdown view could not be appended."
          # The receipt producer is the only cleanup authority: it revalidates
          # the captured directory identity before unlink and rmdir. The shell
          # observes leftovers without traversing or deleting a rejected path.
          if [ -n "$RENOVATE_LOG_DIR" ] && { [ -e "$RENOVATE_LOG_DIR" ] || [ -L "$RENOVATE_LOG_DIR" ]; }; then
            echo "::error title=Renovate log cleanup incomplete::The receipt producer left the private log path in place; no fallback deletion was attempted."
            [ "$receipt_status" -ne 0 ] || receipt_status=1
          fi
          if [ "$TOKEN_OUTCOME" = failure ]; then
            echo "::error title=GitHub App token mint failed::Approve the App installation permission update so it grants the canonical RENOVATE_APP_PERMISSIONS union, then rerun Renovate. Do not remove required scopes to bypass HTTP 422."
          elif [ "$TOKEN_OUTCOME" != success ]; then
            echo "::error title=GitHub App token mint did not run::Repair the preceding setup or runtime phase, then rerun Renovate."
          elif [ "$RENOVATE_OUTCOME" != success ]; then
            echo "::error title=Renovate run failed::Re-dispatch with log_level=debug and inspect the structured repository failures before changing configuration or credentials."
          fi
          exit "$receipt_status"

      - name: Clean private Renovate runtime
        if: always()
        shell: bash
        env:
          RENOVATE_RUNTIME_DIR: ${{ steps.renovate-log.outputs.runtime-directory }}
          RENOVATE_RUNTIME_DIR_IDENTITY: ${{ steps.renovate-log.outputs.runtime-identity }}
          RENOVATE_CONFIG_COPY: ${{ steps.renovate-log.outputs.configuration-file }}
          RENOVATE_ENTRYPOINT_COPY: ${{ steps.renovate-log.outputs.entrypoint }}
          RENOVATE_PHASE_FILE: ${{ steps.renovate-log.outputs.phase-file }}
          RENOVATE_SUMMARY_FILE: ${{ steps.renovate-log.outputs.summary-file }}
        run: |
          set -euo pipefail
          [ -n "$RENOVATE_RUNTIME_DIR" ] && [ -n "$RENOVATE_RUNTIME_DIR_IDENTITY" ] \
            || { echo "::error::Renovate runtime cleanup has no captured directory identity"; exit 1; }
          [ -d "$RENOVATE_RUNTIME_DIR" ] && [ ! -L "$RENOVATE_RUNTIME_DIR" ] \
            || { echo "::error::Renovate runtime cleanup target is not a real directory"; exit 1; }
          [ "$(stat -Lc '%d:%i' "$RENOVATE_RUNTIME_DIR")" = "$RENOVATE_RUNTIME_DIR_IDENTITY" ] \
            || { echo "::error::Renovate runtime cleanup target identity changed"; exit 1; }
          [ "$RENOVATE_CONFIG_COPY" = "$RENOVATE_RUNTIME_DIR/runner.json" ] \
            && [ "$RENOVATE_ENTRYPOINT_COPY" = "$RENOVATE_RUNTIME_DIR/container-entrypoint.sh" ] \
            && [ "$RENOVATE_PHASE_FILE" = "$RENOVATE_RUNTIME_DIR/phases.tsv" ] \
            && [ "$RENOVATE_SUMMARY_FILE" = "$RENOVATE_RUNTIME_DIR/summary.md" ] \
            || { echo "::error::Renovate runtime cleanup paths escaped the captured directory"; exit 1; }
          for file in "$RENOVATE_CONFIG_COPY" "$RENOVATE_ENTRYPOINT_COPY" "$RENOVATE_PHASE_FILE" "$RENOVATE_SUMMARY_FILE"; do
            if [ -e "$file" ] || [ -L "$file" ]; then
              [ -f "$file" ] && [ ! -L "$file" ] \
                || { echo "::error::Renovate runtime cleanup found a non-regular managed path"; exit 1; }
              rm -f -- "$file"
            fi
          done
          rmdir -- "$RENOVATE_RUNTIME_DIR"

      - name: Upload sanitized run receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renovate-run-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: renovate-run-receipt.json
          if-no-files-found: error
          retention-days: 30
