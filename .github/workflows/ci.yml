name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # zizmor-action SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Test
        run: pnpm test

      - name: Check tests are read-only
        id: test-read-only
        run: node tools/check-verification-clean.mjs

      # Two legs, one pin: SARIF upload first so the code-scanning tab stays
      # current even when the gate fails, then a plain-mode leg that FAILS the
      # job on findings — in advanced-security mode the action never fails, so
      # without the gate a new finding merges green and waits in a tab (the
      # github-app token finding sat there 21 days).
      - name: Check workflow security (SARIF upload)
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          persona: pedantic
          advanced-security: true

      - name: Check workflow security (gate)
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          persona: pedantic
          advanced-security: false
          annotations: true

      # Includes the toolchain, preset freeze, workflow timeout, runtime
      # contract, and strict Renovate config checks used locally.
      - name: Validate
        id: validate-config
        run: pnpm validate

      - name: Check validation is read-only
        id: validate-read-only
        run: node tools/check-verification-clean.mjs

      - name: Report validation results
        if: always()
        env:
          CONFIG_OUTCOME: ${{ steps.validate-config.outcome }}
          FAILED_CONFIGS: ${{ steps.validate-config.outputs.failed }}
          RENOVATE_VERSION: ${{ steps.validate-config.outputs.version }}
          TEST_READ_ONLY_OUTCOME: ${{ steps.test-read-only.outcome }}
          VALIDATE_READ_ONLY_OUTCOME: ${{ steps.validate-read-only.outcome }}
        run: |
          label() { case "$1" in success) echo pass ;; failure) echo fail ;; *) echo "$1" ;; esac; }
          {
            echo "### Renovate config validation"
            echo ""
            echo "- Configs: \`default.json\`, \`renovate.json\`, \`runner.json\`"
            echo "- Result: $(label "$CONFIG_OUTCOME")"
            echo "- Renovate version: \`${RENOVATE_VERSION:-unresolved}\`"
            echo "- Reproduce: \`pnpm validate\`"
            echo "- Read-only proof: tests $(label "$TEST_READ_ONLY_OUTCOME"); validation $(label "$VALIDATE_READ_ONLY_OUTCOME")"
            if [ "$CONFIG_OUTCOME" = "failure" ]; then
              echo "- Failed configs: \`${FAILED_CONFIGS:-unknown}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true
