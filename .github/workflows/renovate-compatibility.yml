name: Renovate compatibility
run-name: Renovate compatibility · latest consumer heads · ${{ github.run_id }}.${{ github.run_attempt }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate-compatibility
  cancel-in-progress: false

jobs:
  latest-heads:
    name: latest-heads
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: renovate
    steps:
      - name: Checkout policy repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: renovate-config
          persist-credentials: false

      - name: Mint read-only consumer token
        id: consumer-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: jasondockery
          repositories: roost,groundwork-mac
          permission-contents: read
          permission-metadata: read

      - name: Checkout latest Roost head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jasondockery/roost
          path: roost
          token: ${{ steps.consumer-token.outputs.token }}
          persist-credentials: false

      - name: Checkout latest Groundwork head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jasondockery/groundwork-mac
          path: groundwork-mac
          token: ${{ steps.consumer-token.outputs.token }}
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: renovate-config/.node-version

      - name: Enable Corepack
        run: tools/enable-corepack.sh
        working-directory: renovate-config

      - name: Extract and map latest consumer heads
        id: compatibility
        continue-on-error: true
        env:
          RENOVATE_COMPATIBILITY_REPORT: ${{ runner.temp }}/renovate-compatibility.json
        run: pnpm renovate:compatibility
        working-directory: renovate-config

      - name: Publish exact tested identities
        id: receipt
        if: always()
        continue-on-error: true
        run: node tools/render-renovate-compatibility.mjs "$RUNNER_TEMP/renovate-compatibility.json"
        working-directory: renovate-config

      - name: Upload sanitized compatibility receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renovate-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/renovate-compatibility.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce latest-head compatibility
        if: always()
        env:
          COMPATIBILITY_OUTCOME: ${{ steps.compatibility.outcome }}
          RECEIPT_OUTCOME: ${{ steps.receipt.outcome }}
        run: test "$COMPATIBILITY_OUTCOME" = success && test "$RECEIPT_OUTCOME" = success
        working-directory: renovate-config
