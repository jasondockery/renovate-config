name: Renovate

on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      log_level:
        description: Log level for this Renovate run.
        required: true
        default: info
        type: choice
        options:
          - info
          - debug
          - trace

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: renovate
    # Job-level so both the Renovate step and the run summary read one copy.
    env:
      LOG_LEVEL: ${{ github.event.inputs.log_level || 'info' }}
      # Every targeted repo carries its own renovate.json; never open
      # onboarding PRs from this runner.
      RENOVATE_REPOSITORIES: jasondockery/renovate-config,jasondockery/roost,jasondockery/groundwork
    steps:
      - name: Checkout automation config
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # GitHub App identity (decided 2026-07-09): fine-grained PATs cannot
      # carry the Checks permission at all, so Renovate 403s on the
      # check-runs API, scores every branch yellow, and automerge silently
      # never fires (field-hit on roost PR #24). Apps have Checks plus
      # short-lived installation tokens.
      - name: Mint runner token (GitHub App)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: jasondockery
          repositories: renovate-config,roost,groundwork

      - name: Run Renovate
        id: renovate
        uses: renovatebot/github-action@dd5302ec17783b2fc721b19ae7209b57b1587765 # v46.1.17
        with:
          configurationFile: runner.json
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 43.272.6

      - name: Report run summary
        if: always()
        env:
          RENOVATE_OUTCOME: ${{ steps.renovate.outcome }}
        run: |
          # Read the pinned version from the step above so this step never
          # carries a second copy that could drift.
          version="$(grep -m1 -oE 'renovate-version: [0-9]+\.[0-9]+\.[0-9]+' .github/workflows/renovate.yml | cut -d' ' -f2)"
          if [ "${RENOVATE_OUTCOME}" = "failure" ]; then
            echo "::error title=Renovate run failed::Re-dispatch this workflow with log_level=debug for the full trace. Usual suspects, in order: App token mint (previous step), runner.json repository list, hostRules/credentials, provider rate limits."
          fi
          {
            echo "### Renovate run"
            echo ""
            echo "- Outcome: ${RENOVATE_OUTCOME}"
            echo "- Renovate version: \`${version}\`"
            echo "- Log level: ${LOG_LEVEL}"
            echo "- Repositories: ${RENOVATE_REPOSITORIES}"
            if [ "${RENOVATE_OUTCOME}" = "failure" ]; then
              echo ""
              echo "**Triage (in order):**"
              echo ""
              echo "1. Re-dispatch with \`log_level=debug\` and read the Run Renovate step log for \`ERROR\` / \`Repository has errors\` lines — they name the failing repository."
              echo "2. Token mint step failed instead? App credentials/permissions changed — check the GitHub App installation."
              echo "3. Config-shaped errors: run the CI validators locally (\`npx --yes --package renovate@${version} -- renovate-config-validator runner.json\`)."
              echo "4. Rate-limit or provider errors are transient — the next cron run usually clears them; recurring ones mean a hostRules problem."
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true
